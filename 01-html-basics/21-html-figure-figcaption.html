
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Figure and Figcaption</title>
</head>
<body>

    <header>
        <h1>HTML Figure and Figcaption</h1>
        <p>Learning how to add captions to images and other content.</p>
    </header>

    <main>
        <section>
            <h2>1. Image with a Caption</h2>

            <figure>
                <img
                    src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600"
                    alt="Laptop on a desk used for web development"
                    width="400"
                >
                <figcaption>
                    Figure 1: A workspace for web development.
                </figcaption>
            </figure>
        </section>

        <section>
            <h2>2. Code Example with a Caption</h2>

            <figure>
                <pre><code>
&lt;h1&gt;Hello World&lt;/h1&gt;
&lt;p&gt;Welcome to HTML.&lt;/p&gt;
                </code></pre>
                <figcaption>
                    Figure 2: A simple HTML heading and paragraph.
                </figcaption>
            </figure>
        </section>

        <section>
            <h2>3. Quote with a Caption</h2>

            <figure>
                <blockquote>
                    The secret of getting ahead is getting started.
                </blockquote>
                <figcaption>
                    — Mark Twain (commonly attributed)
                </figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>HTML Learning Lab - Practice File 21</p>
    </footer>

</body>
</html>
