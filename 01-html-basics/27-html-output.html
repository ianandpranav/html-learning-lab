
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Output Element</title>
</head>
<body>

    <header>
        <h1>HTML Output Element</h1>
        <p>Learning how to display the result of a calculation.</p>
    </header>

    <main>
        <section>
            <h2>1. Add Two Numbers</h2>

            <form id="additionForm">
                <label for="firstNumber">First Number:</label>
                <input type="number" id="firstNumber" value="10">

                <br><br>

                <label for="secondNumber">Second Number:</label>
                <input type="number" id="secondNumber" value="20">

                <br><br>

                <button type="submit">Calculate Sum</button>

                <p>
                    Result:
                    <output id="sumResult" for="firstNumber secondNumber">30</output>
                </p>
            </form>
        </section>

        <section>
            <h2>2. Calculate Area</h2>

            <form id="areaForm">
                <label for="length">Length:</label>
                <input type="number" id="length" value="5" min="0">

                <br><br>

                <label for="width">Width:</label>
                <input type="number" id="width" value="4" min="0">

                <br><br>

                <button type="submit">Calculate Area</button>

                <p>
                    Area:
                    <output id="areaResult" for="length width">20</output>
                    square units
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>HTML Learning Lab - Practice File 27</p>
    </footer>

    <script>
        const additionForm = document.getElementById("additionForm");

        additionForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const first = Number(document.getElementById("firstNumber").value);
            const second = Number(document.getElementById("secondNumber").value);

            document.getElementById("sumResult").value = first + second;
        });

        const areaForm = document.getElementById("areaForm");

        areaForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const length = Number(document.getElementById("length").value);
            const width = Number(document.getElementById("width").value);

            document.getElementById("areaResult").value = length * width;
        });
    </script>

</body>
</html>
