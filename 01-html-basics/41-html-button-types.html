
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Button Types</title>
</head>
<body>

    <header>
        <h1>HTML Button Types</h1>
        <p>Learning the different types of buttons in HTML.</p>
    </header>

    <main>
        <section>
            <h2>1. Normal Button</h2>

            <button type="button" id="messageButton">
                Show Message
            </button>

            <p id="message">Click the button to see a message.</p>
        </section>

        <section>
            <h2>2. Submit Button</h2>

            <form id="studentForm">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" name="studentName" required>

                <button type="submit">Submit Form</button>
            </form>

            <p id="formMessage"></p>
        </section>

        <section>
            <h2>3. Reset Button</h2>

            <form>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <button type="reset">Reset Form</button>
            </form>
        </section>

        <section>
            <h2>4. Disabled Button</h2>

            <button type="button" disabled>
                Currently Unavailable
            </button>
        </section>
    </main>

    <footer>
        <p>HTML Learning Lab - Practice File 41</p>
    </footer>

    <script>
        const messageButton = document.getElementById("messageButton");
        const message = document.getElementById("message");

        messageButton.addEventListener("click", function () {
            message.textContent = "Hello! Your button is working.";
        });

        const studentForm = document.getElementById("studentForm");
        const formMessage = document.getElementById("formMessage");

        studentForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const studentName = document.getElementById("studentName").value;

            formMessage.textContent =
                "Form submitted successfully for " + studentName + ".";
        });
    </script>

</body>
</html>
