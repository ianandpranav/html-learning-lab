<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>

    <h1>HTML Entities</h1>

    <p>Less than: &lt;</p>
    <p>Greater than: &gt;</p>
    <p>Ampersand: &amp;</p>
    <p>Copyright: &copy;</p>
    <p>Registered: &reg;</p>
    <p>Non-breaking space: Hello&nbsp;World</p>

</body>
</html>
