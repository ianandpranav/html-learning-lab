<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main>

        <section>
            <h2>About HTML</h2>
            <p>HTML is used to structure web pages.</p>
        </section>

        <article>
            <h2>Learning HTML</h2>
            <p>Semantic elements give meaning to different parts of a webpage.</p>
        </article>

        <aside>
            <h3>Related Information</h3>
            <p>This is additional information.</p>
        </aside>

    </main>

    <footer>
        <p>Copyright 2026 - HTML Learning Lab</p>
    </footer>

</body>
</html>
